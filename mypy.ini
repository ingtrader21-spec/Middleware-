[mypy]
python_version = 3.14
explicit_package_bases = True
show_error_codes = True
warn_unused_configs = True
exclude = ^services/connector-runtime/

# Connector Runtime is checked in a separate dependency environment because its
# independently locked FastAPI/Pydantic stack intentionally differs from core.

# asyncpg does not publish a py.typed marker or maintained type-stub package.
# Keep this exception limited to that dependency; application code remains checked.
[mypy-asyncpg]
ignore_missing_imports = True

[mypy-asyncpg.*]
ignore_missing_imports = True
