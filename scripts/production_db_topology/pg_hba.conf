# PAS-95 disposable production-shaped topology. Certification input only;
# this file is not installed on any server and is not a production authority.
#
# Shape mirrors the live staging class recorded by PAS-180: every network
# login is hostssl + scram-sha-256 + clientcert=verify-full with the client
# certificate CN bound to the role name; every other network path is rejected.
# The bootstrap superuser is reachable only through the local socket (peer).

# TYPE   DATABASE             USER                  ADDRESS      METHOD
local    all                  postgres                           peer
hostssl  codestra_production  middleware_migration  0.0.0.0/0    scram-sha-256 clientcert=verify-full clientname=CN
hostssl  codestra_production  middleware_production 0.0.0.0/0    scram-sha-256 clientcert=verify-full clientname=CN
hostssl  codestra_production  middleware_worker     0.0.0.0/0    scram-sha-256 clientcert=verify-full clientname=CN
hostssl  codestra_production  middleware_scheduler  0.0.0.0/0    scram-sha-256 clientcert=verify-full clientname=CN
hostssl  codestra_production  middleware_reconciler 0.0.0.0/0    scram-sha-256 clientcert=verify-full clientname=CN
hostssl  codestra_production  middleware_backup     0.0.0.0/0    scram-sha-256 clientcert=verify-full clientname=CN
hostssl  codestra_production  postgres_exporter     0.0.0.0/0    scram-sha-256 clientcert=verify-full clientname=CN
host     all                  all                   0.0.0.0/0    reject
host     all                  all                   ::/0         reject
