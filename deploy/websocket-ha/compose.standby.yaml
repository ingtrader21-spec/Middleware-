name: codestra-websocket-standby-031447a

x-gateway: &gateway
  image: ghcr.io/codestra-srl/codestra-websocket-gateway@sha256:1c8f28d3627955c0d07f8a3f2e4187edb0770f3a9fc7cbc7dc9d819fcd255ffd
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m"]

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_DB: codestra_realtime
      POSTGRES_USER: codestra_realtime
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: ["realtime_postgres:/var/lib/postgresql/data"]
    networks:
      backend:
        aliases: [codestra-websocket-gateway-postgres-1]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codestra_realtime -d codestra_realtime"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *gateway
    command: ["/opt/venv/bin/python", "/app/migrate.py", "up"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]
    networks: [backend]

  gateway:
    <<: *gateway
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      INTERNAL_TOKEN_FILE: /run/secrets/internal_token
      KEYCLOAK_ISSUER: https://auth.codestra.co/realms/codestra
      KEYCLOAK_AUDIENCE: codestra-agent-desktop
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/codestra/protocol/openid-connect/certs
      PUBLIC_WS_URL: wss://api.codestra.agency/ws/agent
      ALLOWED_ORIGINS: https://crm.codestra.agency,https://phone.codestra.agency,https://dialer.codestra.agency
      INTERNAL_EVENT_SOURCE_HEALTH_URL: http://middleware:8095/health
      TICKET_TTL_SECONDS: "45"
      WS_AUTH_TIMEOUT_SECONDS: "5"
      MAX_PENDING_MESSAGES: "100"
      MAX_MESSAGE_SIZE: "65536"
      WRITE_TIMEOUT_SECONDS: "3"
    secrets: [database_url, internal_token]
    networks:
      backend: {}
      identity: {}
      probe: {}
      monitoring:
        aliases: [websocket-standby]
    ports: ["127.0.0.1:31882:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

secrets:
  postgres_password:
    file: /etc/codestra/secrets/websocket-gateway/postgres_password
  database_url:
    file: /etc/codestra/secrets/websocket-gateway/database_url
  internal_token:
    file: /etc/codestra/secrets/websocket-gateway/internal_token

volumes:
  realtime_postgres: {}

networks:
  backend:
    internal: true
    ipam:
      config:
        - subnet: 10.253.123.0/28
  # Non-internal network required for Docker to materialize the loopback-only
  # canary port while all application dependency networks remain isolated.
  probe:
    ipam:
      config:
        - subnet: 10.253.124.0/28
  identity:
    external: true
    name: codestra-identity_identity_service
  monitoring:
    external: true
    name: codestra-monitoring_monitoring
