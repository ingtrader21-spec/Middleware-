global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production-readiness
    service: codestra-monitoring

rule_files:
  - /etc/prometheus/rules/odoo-readiness.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: [prometheus:9090]}]
  - job_name: node
    static_configs: [{targets: [node-exporter:9100]}]
  - job_name: containers
    static_configs: [{targets: [cadvisor:8080]}]
  - job_name: postgres
    static_configs: [{targets: [postgres-exporter:9187]}]
  - job_name: redis
    static_configs: [{targets: [redis-exporter:9121]}]
  - job_name: middleware
    metrics_path: /metrics
    static_configs: [{targets: [middleware-integration-api:8095]}]
  - job_name: odoo-blackbox
    metrics_path: /probe
    params: {module: [https_2xx]}
    static_configs:
      - targets: [https://crm.codestra.agency/web/health]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: blackbox:9115}
  - job_name: caddy-blackbox
    metrics_path: /probe
    params: {module: [https_2xx]}
    static_configs:
      - targets: [https://crm.codestra.agency/web/health]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: blackbox:9115}
