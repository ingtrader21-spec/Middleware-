  /api/v1/events/telnexa:
    post:
      tags:
      - telnexa-events
      summary: Receive Telnexa Event
      operationId: receive_telnexa_event_api_v1_events_telnexa_post
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnexaDeliveryAck'
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelnexaDeliveryAck'
          description: OK
        '400':
          description: Invalid canonical request
        '401':
          description: Authentication failed
        '403':
          description: Scope or tenant denied
        '404':
          description: Resource not found
        '409':
          description: Version, state, or idempotency conflict
        '429':
          description: Rate limited
        '503':
          description: Required durable dependency unavailable
      security:
      - telnexaBearerApiKey: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 8192
        description: Bearer shared API key; the caller must also present the private
          Telnexa mTLS client identity.
      - name: X-Codestra-Client-Certificate-DER
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 16384
        description: Base64 DER of the Telnexa mTLS client leaf, forwarded only by
          the allow-listed internal edge and re-verified against the pinned CA, URI
          SAN and fingerprint allow-list.
      - name: X-Event-Id
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: X-Timestamp
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9]{1,12}$
      - name: X-Signature
        in: header
        required: true
        schema:
          type: string
          pattern: ^sha256=[0-9a-f]{64}$
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              description: The exact provider callback body, with no generic-envelope
                fields.
              properties:
                event_id:
                  maxLength: 200
                  minLength: 1
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
                  title: Event Id
                  type: string
                event_type:
                  enum:
                  - sms.message.delivered.v1
                  - sms.message.failed.v1
                  - sms.message.status.v1
                  - sms.message.reconciled.v1
                  title: Event Type
                  type: string
                event_version:
                  pattern: ^1\.0$
                  title: Event Version
                  type: string
                schema_version:
                  pattern: ^1\.0$
                  title: Schema Version
                  type: string
                timestamp:
                  pattern: ^[0-9]{1,12}$
                  title: Timestamp
                  type: string
                occurred_at:
                  format: date-time
                  title: Occurred At
                  type: string
                tenant_id:
                  maxLength: 200
                  minLength: 1
                  title: Tenant Id
                  type: string
                correlation_id:
                  maxLength: 200
                  minLength: 1
                  title: Correlation Id
                  type: string
                idempotency_key:
                  maxLength: 255
                  minLength: 1
                  title: Idempotency Key
                  type: string
                message_id:
                  format: uuid
                  title: Message Id
                  type: string
                provider_reference:
                  anyOf:
                  - maxLength: 998
                    type: string
                  - type: 'null'
                  title: Provider Reference
                status:
                  enum:
                  - accepted
                  - queued
                  - dispatched
                  - delivered
                  - failed
                  - cancelled
                  - suppressed
                  - expired
                  - indeterminate
                  title: Status
                  type: string
                provider_status:
                  maxLength: 120
                  minLength: 1
                  title: Provider Status
                  type: string
                failure_code:
                  anyOf:
                  - maxLength: 120
                    type: string
                  - type: 'null'
                  title: Failure Code
                failure_message:
                  anyOf:
                  - maxLength: 2000
                    type: string
                  - type: 'null'
                  title: Failure Message
              required:
              - event_id
              - event_type
              - event_version
              - schema_version
              - timestamp
              - occurred_at
              - tenant_id
              - correlation_id
              - idempotency_key
              - message_id
              - status
              - provider_status
              title: TelnexaDeliveryEvent
              type: object
