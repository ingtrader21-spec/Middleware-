[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codestra-middleware"
version = "1.3.0rc2"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.16.4",
  "asyncpg==0.30.0",
  "cryptography==50.0.0",
  "email-validator==2.2.0",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "jsonschema[format]==4.26.0",
  "nats-py==2.15.0",
  "phonenumbers==9.0.10",
  "prometheus-client==0.22.1",
  "pydantic-settings==2.10.1",
  "psycopg[binary]==3.2.9",
  "PyJWT==2.13.0",
  "PyYAML==6.0.3",
  "redis==6.4.0",
  "sqlalchemy==2.0.43",
  "starlette==1.3.1",
  "temporalio==1.32.0",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = [
  "aiosqlite==0.22.1",
  "mypy==1.17.1",
  "pytest==9.1.1",
  "ruff==0.12.10",
]

[tool.setuptools.packages.find]
include = ["app*", "middleware*"]
