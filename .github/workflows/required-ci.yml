name: Required exact-SHA CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full repository commit SHA to test
        required: true
        type: string

permissions:
  contents: read
  statuses: write
  actions: read

concurrency:
  group: required-ci-${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
  STATUS_CONTEXT: codestra/required-ci
  RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  test:
    name: Test exact repository SHA
    runs-on: [self-hosted, Linux, X64, middleware-ci]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: middleware_rehearsal
          POSTGRES_USER: middleware_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U middleware_ci -d middleware_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Validate target and publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/commits/${TARGET_SHA}" > target-commit.json
          test "$(python3 -c 'import json; print(json.load(open("target-commit.json"))["sha"])')" \
            = "${TARGET_SHA}"
          python3 - <<'PY' > pending-status.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": os.environ["STATUS_CONTEXT"],
              "description": f"Required CI run {os.environ['GITHUB_RUN_ID']} started",
              "target_url": os.environ["RUN_URL"],
          }))
          PY
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/statuses/${TARGET_SHA}" \
            --data @pending-status.json > pending-status-response.json

      - name: Check out exact target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git status --porcelain)"
          git diff --check
          git cat-file -e "${TARGET_SHA}^{commit}"
          git show -s --format='%H %T %P' HEAD | tee checked-out-identity.txt

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-test.lock

      - name: Install checksum-pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes -r requirements.lock -r requirements-test.lock
          python --version | tee python-version.txt
          python -m pip check | tee dependency-check.txt

      - name: Assert isolated dependency and fail-closed configuration
        shell: bash
        env:
          CI_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          CI_REDIS_PORT: ${{ job.services.redis.ports[6379] }}
          DATABASE_URL: postgresql+asyncpg://middleware_ci:ci-only-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/middleware_rehearsal
          TEST_DATABASE_URL: postgresql+asyncpg://middleware_ci:ci-only-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/middleware_rehearsal
          REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports[6379] }}/15
          LIVE_WRITES_ENABLED: "false"
          N8N_PRODUCTION_WORKFLOWS_ENABLED: "false"
          VICIDIAL_WRITE_ENABLED: "false"
          CALLBACK_DISPATCH_ENABLED: "false"
          MESSAGING_ENABLED: "false"
          OUTBOX_WORKER_ENABLED: "false"
        run: |
          set -euo pipefail
          test "${DATABASE_URL}" = \
            "postgresql+asyncpg://middleware_ci:ci-only-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/middleware_rehearsal"
          test "${TEST_DATABASE_URL}" = \
            "postgresql+asyncpg://middleware_ci:ci-only-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/middleware_rehearsal"
          for value in \
            "${LIVE_WRITES_ENABLED}" \
            "${N8N_PRODUCTION_WORKFLOWS_ENABLED}" \
            "${VICIDIAL_WRITE_ENABLED}" \
            "${CALLBACK_DISPATCH_ENABLED}" \
            "${MESSAGING_ENABLED}" \
            "${OUTBOX_WORKER_ENABLED}"; do
            test "${value}" = "false"
          done
          env | cut -d= -f1 | sort > environment-names-only.txt
          ! env | cut -d= -f1 | grep -Eq \
            '^(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|B2_APPLICATION_KEY|SMTP_PASSWORD|TWILIO_AUTH_TOKEN|VICIDIAL_DB_PASSWORD|ODOO_DATABASE_PASSWORD)$'
          python scripts/validate_ci_isolation.py
          # Source contains intentional production-denial fixtures and restricted
          # operator bind addresses. Block actual traffic instead of pretending
          # a missing `rg` executable proves that those strings do not exist.
          for target in 65.109.65.169/32 65.21.67.207/32 37.27.128.39/32 10.40.0.0/24; do
            for chain in OUTPUT FORWARD; do
              sudo -n iptables -I "$chain" 1 -d "$target" -j REJECT
              sudo -n iptables -C "$chain" -d "$target" -j REJECT
            done
          done
          echo 'CI_RUNTIME_EGRESS_DENY=PASS'

      - name: Lint and type checks
        shell: bash
        run: |
          set -euo pipefail
          # The repository has no Ruff configuration and carries legacy style
          # debt outside this release. Enforce correctness rules everywhere,
          # then enforce the complete default ruleset on Python changed by the
          # exact target commit.
          ruff check --select E9,F63,F7,F82 app tests | tee ruff.txt
          mapfile -t changed_python < <(
            git diff-tree --no-commit-id --name-only -r "${TARGET_SHA}" \
              -- '*.py' \
              | while IFS= read -r path; do
                  [[ -f "${path}" ]] && printf '%s\n' "${path}"
                done
          )
          if ((${#changed_python[@]})); then
            ruff check "${changed_python[@]}" | tee ruff-changed.txt
            mypy --ignore-missing-imports --explicit-package-bases \
              "${changed_python[@]}" | tee mypy.txt
          else
            printf 'No Python files changed by target commit.\n' \
              | tee ruff-changed.txt
            printf 'No Python files changed by target commit.\n' \
              | tee mypy.txt
          fi

      - name: Build Docker test target
        shell: bash
        run: |
          set -euo pipefail
          docker build --target test \
            --build-arg 'PYTHON_BASE=python@sha256:6d43704baacd1bfbe7c295d7f13079d5d8104ed33568873133f8fc69980419df' \
            --tag "codestra-middleware-ci:${TARGET_SHA}" . \
            | tee docker-test-build.txt

      - name: Run migration chain and database tests
        shell: bash
        env:
          DATABASE_URL: postgresql+asyncpg://middleware_ci:ci-only-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/middleware_rehearsal
          TEST_DATABASE_URL: postgresql+asyncpg://middleware_ci:ci-only-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/middleware_rehearsal
          MIDDLEWARE_SECRET: synthetic-ci-middleware-secret
          INGESTION_HMAC_SECRET: synthetic-ci-ingestion-secret
          LIVE_WRITES_ENABLED: "false"
          N8N_PRODUCTION_WORKFLOWS_ENABLED: "false"
          VICIDIAL_WRITE_ENABLED: "false"
          CALLBACK_DISPATCH_ENABLED: "false"
          MESSAGING_ENABLED: "false"
          OUTBOX_WORKER_ENABLED: "false"
        run: |
          set -euo pipefail
          alembic upgrade head | tee migration-upgrade.txt
          expected_migration_head="$(alembic heads | awk 'NR == 1 {print $1}')"
          test -n "${expected_migration_head}"
          test "$(python -c 'import asyncio, asyncpg, os; dsn = os.environ["TEST_DATABASE_URL"].replace("postgresql+asyncpg://", "postgresql://", 1); loop = asyncio.new_event_loop(); conn = loop.run_until_complete(asyncpg.connect(dsn)); print(loop.run_until_complete(conn.fetchval("SELECT version_num FROM alembic_version"))); loop.run_until_complete(conn.close()); loop.close()')" = "${expected_migration_head}"
          alembic downgrade 0027_telephony_command_journal \
            | tee migration-recording-downgrade.txt
          python -c 'import asyncio, asyncpg, os; dsn = os.environ["TEST_DATABASE_URL"].replace("postgresql+asyncpg://", "postgresql://", 1); loop = asyncio.new_event_loop(); conn = loop.run_until_complete(asyncpg.connect(dsn)); tables = loop.run_until_complete(conn.fetchval("SELECT count(*) FROM information_schema.tables WHERE table_schema = '"'"'public'"'"' AND table_name IN ('"'"'recordings'"'"', '"'"'recording_upload_reservations'"'"', '"'"'recording_objects'"'"', '"'"'recording_delivery_attempts'"'"', '"'"'recording_retention_policies'"'"', '"'"'recording_retention_decisions'"'"', '"'"'recording_playback_audit'"'"', '"'"'recording_outbox'"'"')")); assert tables == 0, tables; loop.run_until_complete(conn.close()); loop.close()'
          alembic upgrade head | tee migration-recording-reupgrade.txt
          test "$(python -c 'import asyncio, asyncpg, os; dsn = os.environ["TEST_DATABASE_URL"].replace("postgresql+asyncpg://", "postgresql://", 1); loop = asyncio.new_event_loop(); conn = loop.run_until_complete(asyncpg.connect(dsn)); print(loop.run_until_complete(conn.fetchval("SELECT version_num FROM alembic_version"))); loop.run_until_complete(conn.close()); loop.close()')" = "${expected_migration_head}"
          python -m pytest -q tests | tee pytest-full.txt
          TEST_DATABASE_URL='postgresql://middleware_ci:ci-only-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/middleware_rehearsal' \
            python tests/integration/campaign_extension_concurrency.py \
            | tee campaign-extension-concurrency.txt
          TEST_DATABASE_URL='postgresql://middleware_ci:ci-only-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/middleware_rehearsal' \
            python tests/integration/campaign_identity_concurrency.py \
            | tee campaign-identity-concurrency.txt

          # Re-establish and certify every runtime migration authority after
          # tests that intentionally create/drop isolated runtime tables.
          python -m scripts.migrate_runtime \
            | tee runtime-migration.txt

          python -m scripts.migrate_runtime --verify-only \
            | tee runtime-migration-verify.txt

      - name: Verify rollback by isolated restoration
        shell: bash
        env:
          PGPASSWORD: ci-only-password
        run: |
          set -euo pipefail
          PG_IMAGE='postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193'
          docker run --rm --network host -e PGPASSWORD -v "${PWD}:/work" \
            "${PG_IMAGE}" pg_dump \
            -h 127.0.0.1 -U middleware_ci -Fc middleware_rehearsal \
            -f /work/middleware-rehearsal.dump
          docker run --rm --network host -e PGPASSWORD \
            "${PG_IMAGE}" psql \
            -h 127.0.0.1 -U middleware_ci -d postgres \
            -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE middleware_restore OWNER middleware_ci'
          docker run --rm --network host -e PGPASSWORD -v "${PWD}:/work:ro" \
            "${PG_IMAGE}" pg_restore \
            -h 127.0.0.1 -U middleware_ci -d middleware_restore \
            --exit-on-error /work/middleware-rehearsal.dump
          restored_head="$(
            docker run --rm --network host -e PGPASSWORD \
              "${PG_IMAGE}" psql \
              -h 127.0.0.1 -U middleware_ci -d middleware_restore \
              -Atc 'SELECT version_num FROM alembic_version'
          )"
          expected_migration_head="$(alembic heads | awk 'NR == 1 {print $1}')"
          test -n "${expected_migration_head}"
          test "${restored_head}" = "${expected_migration_head}"
          sha256sum middleware-rehearsal.dump > restoration.sha256

      - name: Application startup and disabled defaults
        shell: bash
        env:
          DATABASE_URL: postgresql+asyncpg://middleware_ci:ci-only-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/middleware_rehearsal
          REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports[6379] }}/15
          MIDDLEWARE_SECRET: synthetic-ci-middleware-secret
          INGESTION_HMAC_SECRET: synthetic-ci-ingestion-secret
          LIVE_WRITES_ENABLED: "false"
          N8N_PRODUCTION_WORKFLOWS_ENABLED: "false"
          VICIDIAL_WRITE_ENABLED: "false"
          CALLBACK_DISPATCH_ENABLED: "false"
          MESSAGING_ENABLED: "false"
          OUTBOX_WORKER_ENABLED: "false"
        run: |
          set -euo pipefail
          uvicorn app.main:app --host 127.0.0.1 --port 8095 \
            > application-startup.txt 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8095/healthz \
              > healthz.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8095/healthz \
            | tee healthz-final.json
          curl --fail --silent http://127.0.0.1:8095/readyz \
            | tee readyz-final.json
          python - <<'PY'
          from app.core.config import settings
          settings.validate_safety()
          assert not settings.live_writes_enabled
          assert not settings.n8n_production_workflows_enabled
          assert not settings.vicidial_write_enabled
          assert not settings.callback_dispatch_enabled
          assert not settings.messaging_enabled
          assert not settings.outbox_worker_enabled
          PY
          kill "${server_pid}"
          wait "${server_pid}" || true
          trap - EXIT

      - name: Certify required-database readiness failure modes
        shell: bash
        env:
          MIDDLEWARE_SECRET: synthetic-ci-middleware-secret
          INGESTION_HMAC_SECRET: synthetic-ci-ingestion-secret
          HEALTH_REQUIRE_DATABASE: "true"
          REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports[6379] }}/15
          KEYCLOAK_ISSUER: https://ci-identity.example.invalid/realm
          KEYCLOAK_AUDIENCE: middleware-api
          KEYCLOAK_AUTHORIZED_PARTIES: ci-readiness-only
          KEYCLOAK_JWKS_URL: http://127.0.0.1:8120/certs.json
          LIVE_WRITES_ENABLED: "false"
          N8N_PRODUCTION_WORKFLOWS_ENABLED: "false"
          VICIDIAL_WRITE_ENABLED: "false"
          CALLBACK_DISPATCH_ENABLED: "false"
          MESSAGING_ENABLED: "false"
          OUTBOX_WORKER_ENABLED: "false"
        run: |
          set -euo pipefail
          # Only a disposable public signing-key fixture is served; no user
          # identities, private keys or tokens are issued by this readiness test.
          mkdir -p "$RUNNER_TEMP/ci-readiness-jwks"
          python - <<'PYKEY'
          import json, os
          from pathlib import Path
          import jwt
          from cryptography.hazmat.primitives.asymmetric import rsa
          public = rsa.generate_private_key(public_exponent=65537, key_size=2048).public_key()
          jwk = json.loads(jwt.algorithms.RSAAlgorithm.to_jwk(public))
          jwk.update(kid="ci-readiness-only", alg="RS256", use="sig")
          path = Path(os.environ["RUNNER_TEMP"]) / "ci-readiness-jwks/certs.json"
          path.write_text(json.dumps({"keys": [jwk]}))
          PYKEY
          python -m http.server 8120 --bind 127.0.0.1 \
            --directory "$RUNNER_TEMP/ci-readiness-jwks" \
            > "$RUNNER_TEMP/ci-readiness-jwks/server.log" 2>&1 &
          jwks_pid=$!
          trap 'kill "$jwks_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent "$KEYCLOAK_JWKS_URL" >/dev/null && break
            sleep 1
          done
          curl --fail --silent "$KEYCLOAK_JWKS_URL" >/dev/null
          audit_case() {
            local name=$1 database_url=$2 expected=$3 port=$4
            DATABASE_URL="${database_url}" \
              uvicorn app.entrypoints.integration_api:app \
                --host 127.0.0.1 --port "${port}" \
                > "readiness-${name}.log" 2>&1 &
            local server_pid=$!
            for attempt in {1..30}; do
              curl --silent "http://127.0.0.1:${port}/healthz" >/dev/null \
                && break
              sleep 1
            done
            local status
            status=$(curl --silent --output "readiness-${name}.json" \
              --write-out '%{http_code}' "http://127.0.0.1:${port}/readyz")
            kill "${server_pid}"
            wait "${server_pid}" || true
            test "${status}" = "${expected}"
          }
          audit_case healthy \
            'postgresql+asyncpg://middleware_ci:ci-only-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/middleware_rehearsal' \
            200 8101
          audit_case wrong-credential \
            'postgresql+asyncpg://middleware_ci:wrong@127.0.0.1:${{ job.services.postgres.ports[5432] }}/middleware_rehearsal' \
            503 8102
          audit_case dns-failure \
            'postgresql+asyncpg://middleware_ci:wrong@database.invalid:5432/middleware_rehearsal' \
            503 8103
          audit_case tcp-failure \
            'postgresql+asyncpg://middleware_ci:wrong@127.0.0.1:1/middleware_rehearsal' \
            503 8104
          REDIS_URL='redis://127.0.0.1:1/15' audit_case redis-failure \
            'postgresql+asyncpg://middleware_ci:ci-only-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/middleware_rehearsal' \
            503 8105

          # Preserve the approved synthetic-CI identity URL while making its
          # dependency unavailable. This tests runtime readiness failure
          # without weakening configuration authority.
          kill "${jwks_pid}"
          wait "${jwks_pid}" || true

          audit_case keycloak-failure \
            'postgresql+asyncpg://middleware_ci:ci-only-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/middleware_rehearsal' \
            503 8106
          python -m scripts.audit_release_endpoints \
            | tee release-endpoint-contract.txt

      - name: Create test evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            checked-out-identity.txt \
            python-version.txt \
            dependency-check.txt \
            environment-names-only.txt \
            ruff.txt \
            ruff-changed.txt \
            mypy.txt \
            docker-test-build.txt \
            migration-upgrade.txt \
            pytest-full.txt \
            campaign-extension-concurrency.txt \
            campaign-identity-concurrency.txt \
            runtime-migration.txt \
            runtime-migration-verify.txt \
            middleware-rehearsal.dump \
            restoration.sha256 \
            application-startup.txt \
            healthz-final.json \
            readyz-final.json \
            readiness-healthy.json \
            readiness-wrong-credential.json \
            readiness-dns-failure.json \
            readiness-tcp-failure.json \
            readiness-redis-failure.json \
            readiness-keycloak-failure.json \
            release-endpoint-contract.txt \
            > required-ci-evidence.sha256

      - name: Upload exact-SHA CI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: required-ci-${{ env.TARGET_SHA }}-${{ github.run_id }}
          if-no-files-found: error
          overwrite: false
          retention-days: 90
          path: |
            checked-out-identity.txt
            python-version.txt
            dependency-check.txt
            environment-names-only.txt
            ruff.txt
            ruff-changed.txt
            mypy.txt
            docker-test-build.txt
            migration-upgrade.txt
            pytest-full.txt
            campaign-extension-concurrency.txt
            campaign-identity-concurrency.txt
            runtime-migration.txt
            runtime-migration-verify.txt
            middleware-rehearsal.dump
            restoration.sha256
            application-startup.txt
            healthz-final.json
            readyz-final.json
            readiness-healthy.json
            readiness-wrong-credential.json
            readiness-dns-failure.json
            readiness-tcp-failure.json
            readiness-redis-failure.json
            readiness-keycloak-failure.json
            release-endpoint-contract.txt
            required-ci-evidence.sha256

  publish-final-status:
    name: Publish exact-SHA final status
    needs: test
    if: ${{ always() }}
    runs-on: [self-hosted, Linux, X64, middleware-ci]
    timeout-minutes: 5
    steps:
      - name: Publish status from explicit required-job result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          case "${TEST_RESULT}" in
            success)
              state=success
              description="Required CI run ${GITHUB_RUN_ID} passed"
              ;;
            failure)
              state=failure
              description="Required CI run ${GITHUB_RUN_ID} failed"
              ;;
            cancelled|skipped)
              state=error
              description="Required CI run ${GITHUB_RUN_ID} incomplete"
              ;;
            *)
              state=error
              description="Required CI run ${GITHUB_RUN_ID} unknown result"
              ;;
          esac
          python3 - "${state}" "${description}" <<'PY' > final-status.json
          import json, os, sys
          print(json.dumps({
              "state": sys.argv[1],
              "context": os.environ["STATUS_CONTEXT"],
              "description": sys.argv[2],
              "target_url": os.environ["RUN_URL"],
          }))
          PY
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data @final-status.json > final-status-response.json
