name: Single-lane agent governance

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  governance:
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04, middleware-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize exact branch refs
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git fetch --no-tags origin "$branch:refs/remotes/origin/$branch"
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          fi
          git branch -f "$branch" "refs/remotes/origin/$branch"
          git checkout "$branch"
          git branch --set-upstream-to="origin/$branch" "$branch"
      - name: Validate single-lane authority
        shell: bash
        run: |
          chmod +x scripts/agent_preflight.sh
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          ./scripts/agent_preflight.sh --ci --branch "$branch"
