name: source-lock-candidate-build

on:
  pull_request:
    paths:
      - app/**
      - deploy/beyvra-email/**
      - Dockerfile
      - requirements.lock
      - .github/workflows/source-lock-candidate-build.yml
      - .github/workflows/production-reviewer-access.yml
      - tests/test_release_workflow_regressions.py
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    # RUNTIME_MUTATION_DISABLED=true: candidate publication requires separate release authorization.
    if: ${{ false }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: middleware-source-lock
            dockerfile: Dockerfile
            target: runtime
          - component: beyvra-email
            dockerfile: deploy/beyvra-email/Dockerfile
            target: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release workflow regressions without credentials
        run: python3 -m unittest -v tests.test_release_workflow_regressions
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v3.11.1
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6.18.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ghcr.io/appolon1908-hue/${{ matrix.component }}:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_CREATED=${{ github.event.head_commit.timestamp }}
            IMAGE_VERSION=${{ github.sha }}
            VERSION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: ${{ github.event_name == 'push' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name == 'push' }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/appolon1908-hue/${{ matrix.component }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Verify immutable candidate evidence
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/appolon1908-hue/${{ matrix.component }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" --format '{{ json .SBOM }}' > sbom.json
          docker buildx imagetools inspect "$IMAGE" --format '{{ json .Provenance }}' > provenance.json
          jq -e 'type == "object" and length > 0' sbom.json >/dev/null
          jq -e 'type == "object" and length > 0' provenance.json >/dev/null
          printf '%s\n' "SOURCE_SHA=${GITHUB_SHA}" "IMAGE_DIGEST=${{ steps.build.outputs.digest }}" \
            "SBOM=PASS" "PROVENANCE=PASS" "VULNERABILITY_GATE=PASS" \
            "OCI_SOURCE=PASS" "OCI_REVISION=PASS" "OCI_VERSION=PASS" \
            > candidate-${{ matrix.component }}.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push'
        with:
          name: candidate-${{ matrix.component }}
          path: candidate-${{ matrix.component }}.txt
