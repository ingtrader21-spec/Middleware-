name: Apply protected main release authorities

on:
  pull_request:
    paths:
      - ".github/workflows/portfolio-main-release-authorities.yml"
      - "config/portfolio-main-release-authorities.v1.json"
      - "scripts/apply_portfolio_main_release_authorities.py"
      - "scripts/apply_portfolio_release_reviewer_access.py"
      - "tests/test_portfolio_main_release_authorities.py"
      - "tests/test_portfolio_release_reviewer_access.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/portfolio-main-release-authorities.yml"
      - "config/portfolio-main-release-authorities.v1.json"
      - "scripts/apply_portfolio_main_release_authorities.py"
      - "scripts/apply_portfolio_release_reviewer_access.py"
      - "tests/test_portfolio_main_release_authorities.py"
      - "tests/test_portfolio_release_reviewer_access.py"
  workflow_dispatch:
    inputs:
      mode:
        description: Validate policy or apply the fixed reviewer and exact rulesets
        required: true
        type: choice
        options: [validate, apply]
        default: validate
      confirmation:
        description: For apply, type APPLY_MAIN_RELEASE_AUTHORITY_V1
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: portfolio-main-release-authorities-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  policy:
    name: portfolio-main-release-authority-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - name: Validate bounded governance and reviewer policies
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            scripts/apply_portfolio_main_release_authorities.py \
            scripts/apply_portfolio_release_reviewer_access.py \
            tests/test_portfolio_main_release_authorities.py \
            tests/test_portfolio_release_reviewer_access.py
          python3 -m unittest -v \
            tests.test_portfolio_main_release_authorities \
            tests.test_portfolio_release_reviewer_access
          python3 scripts/apply_portfolio_main_release_authorities.py --mode validate
          python3 scripts/apply_portfolio_release_reviewer_access.py --mode validate
          python3 -m json.tool config/portfolio-main-release-authorities.v1.json >/dev/null
          git diff --check
      - name: Upload secret-free policy evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-main-release-authority-policy-${{ env.EXPECTED_SHA }}
          path: |
            artifacts/portfolio-main-release-authorities/
            artifacts/portfolio-release-reviewer-access/
          if-no-files-found: error
          retention-days: 30

  apply:
    name: apply-and-verify-main-release-authorities
    needs: [policy]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      inputs.mode == 'apply'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: repository-administration
    steps:
      - name: Check out exact protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Require exact protected source and confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$CONFIRMATION" = APPLY_MAIN_RELEASE_AUTHORITY_V1
      - name: Apply and read back all six rulesets
        env:
          CODESTRA_REPOSITORY_ADMIN_TOKEN: ${{ secrets.CODESTRA_REPOSITORY_ADMIN_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$CODESTRA_REPOSITORY_ADMIN_TOKEN"
          python3 scripts/apply_portfolio_main_release_authorities.py \
            --mode apply \
            --confirm APPLY_MAIN_RELEASE_AUTHORITY_V1
      - id: reviewer
        name: Configure and verify the exact independent reviewer
        continue-on-error: true
        env:
          CODESTRA_REPOSITORY_ADMIN_TOKEN: ${{ secrets.CODESTRA_REPOSITORY_ADMIN_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$CODESTRA_REPOSITORY_ADMIN_TOKEN"
          python3 scripts/apply_portfolio_release_reviewer_access.py \
            --mode apply \
            --confirm APPLY_MAIN_RELEASE_AUTHORITY_V1
      - name: Upload bounded rollout evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-main-release-authority-rollout-${{ github.sha }}
          path: |
            artifacts/portfolio-main-release-authorities/
            artifacts/portfolio-release-reviewer-access/
          if-no-files-found: error
          retention-days: 90
      - name: Fail closed while reviewer invitations await acceptance
        if: ${{ steps.reviewer.outcome != 'success' }}
        run: |
          echo 'PORTFOLIO_RELEASE_REVIEWER_ACCESS=BLOCKED' >&2
          echo 'The exact reviewer must accept every pending repository invitation.' >&2
          exit 1
      - name: Confirm no runtime effect
        if: always()
        run: |
          echo 'RUNTIME_CONTACTED=NO'
          echo 'PRODUCTION_CHANGED=NO'
          echo 'EXTERNAL_EFFECTS_ENABLED=NO'
