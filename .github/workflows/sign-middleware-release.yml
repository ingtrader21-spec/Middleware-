name: Sign middleware release

on:
  workflow_dispatch:
    inputs:
      image_repository:
        description: Exact allowlisted middleware image repository
        required: true
        type: string
      image_digest:
        description: Exact sha256 image digest
        required: true
        type: string
      source_commit:
        description: Exact reviewed source commit on main
        required: true
        type: string
      release_tag:
        description: Immutable image release tag
        required: true
        type: string
      evidence_run_id:
        description: Workflow run containing the release evidence artifact
        required: true
        type: string
      evidence_artifact:
        description: Exact evidence artifact name
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write
  packages: write

concurrency:
  group: sign-middleware-${{ inputs.image_digest }}
  cancel-in-progress: false

jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: security-release
    timeout-minutes: 20
    env:
      IMAGE_REPOSITORY: ${{ inputs.image_repository }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
      EVIDENCE_ARTIFACT: ${{ inputs.evidence_artifact }}
      COSIGN_VERSION: v3.1.2
      COSIGN_SHA256: f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out protected main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "ingtrader21-spec/Middleware-"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${IMAGE_REPOSITORY}" = \
            "ghcr.io/appolon1908-hue/codestra-middleware"
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${RELEASE_TAG}" =~ ^middleware-[0-9A-Za-z][0-9A-Za-z._-]{0,79}$ ]]
          [[ "${EVIDENCE_RUN_ID}" =~ ^[0-9]+$ ]]
          [[ "${EVIDENCE_ARTIFACT}" =~ ^middleware-release-evidence-[0-9a-f]{40}$ ]]
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git merge-base --is-ancestor "${SOURCE_COMMIT}" origin/main
          test "$(git rev-parse --is-shallow-repository)" = "false"

      - name: Download exact run-scoped evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          gh run download "${EVIDENCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${EVIDENCE_ARTIFACT}" \
            --dir evidence
          test -f evidence/SHA256SUMS
          (
            cd evidence
            sha256sum -c SHA256SUMS
          )

      - name: Verify evidence and zero-unaccepted-vulnerability gate
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            sbom.spdx.json provenance.json openvex.json \
            security-decision.json evidence-manifest.json scan-summary.json
          do
            test -s "evidence/${file}"
          done
          jq -e \
            --arg digest "${IMAGE_DIGEST}" \
            --arg source "${SOURCE_COMMIT}" \
            --arg sbom_sha256 "$(sha256sum evidence/sbom.spdx.json | cut -d' ' -f1)" \
            --arg provenance_sha256 "$(sha256sum evidence/provenance.json | cut -d' ' -f1)" \
            --arg vex_sha256 "$(sha256sum evidence/openvex.json | cut -d' ' -f1)" \
            --arg decision_sha256 "$(sha256sum evidence/security-decision.json | cut -d' ' -f1)" '
              .image_digest == $digest and
              .source_commit == $source and
              .sbom_spdx_sha256 == $sbom_sha256 and
              .provenance_sha256 == $provenance_sha256 and
              .openvex_sha256 == $vex_sha256 and
              .security_decision_sha256 == $decision_sha256 and
              .format_gate == "PASS" and
              .ruff_gate == "PASS" and
              .mypy_gate == "PASS" and
              .pytest_gate == "PASS" and
              .failed_test_count == 0
            ' evidence/evidence-manifest.json
          jq -e \
            --arg digest "${IMAGE_DIGEST}" '
              .image_digest == $digest and
              .trivy_critical == 0 and
              .trivy_unaccepted_high == 0 and
              .grype_critical == 0 and
              .grype_unaccepted_high == 0
            ' evidence/scan-summary.json
          jq -e \
            --arg digest "${IMAGE_DIGEST}" \
            --arg source "${SOURCE_COMMIT}" '
              .image_digest == $digest and
              .source_commit == $source and
              .decision == "APPROVED_FOR_RELEASE" and
              .unaccepted_critical_count == 0 and
              .unaccepted_high_count == 0 and
              (.security_owner | type == "string" and length > 0)
            ' evidence/security-decision.json
          jq -e \
            --arg digest "${IMAGE_DIGEST}" '
              .subject[0].digest.sha256 == ($digest | sub("^sha256:";""))
            ' evidence/provenance.json
          jq -e \
            --arg digest "${IMAGE_DIGEST}" '
              all(.statements[];
                all(.products[];
                  .["@id"] | contains($digest)))
            ' evidence/openvex.json

      - name: Verify registry digest and immutable tag binding
        shell: bash
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
          docker buildx imagetools inspect \
            "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" > registry-digest.txt
          grep -Fq "Digest:    ${IMAGE_DIGEST}" registry-digest.txt
          tag_digest="$(
            docker buildx imagetools inspect \
              "${IMAGE_REPOSITORY}:${RELEASE_TAG}" \
              --format '{{json .Manifest.Digest}}' | tr -d '"'
          )"
          test "${tag_digest}" = "${IMAGE_DIGEST}"

      - name: Install checksum-pinned Cosign
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${RUNNER_TEMP}/cosign" "${url}"
          echo "${COSIGN_SHA256}  ${RUNNER_TEMP}/cosign" | sha256sum -c -
          install -m 0755 "${RUNNER_TEMP}/cosign" "${RUNNER_TEMP}/bin-cosign"
          "${RUNNER_TEMP}/bin-cosign" version > cosign-version.txt

      - name: Keylessly sign digest and attestations
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          subject="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          "${RUNNER_TEMP}/bin-cosign" sign --yes "${subject}"
          "${RUNNER_TEMP}/bin-cosign" attest --yes \
            --type spdxjson --predicate evidence/sbom.spdx.json "${subject}"
          "${RUNNER_TEMP}/bin-cosign" attest --yes \
            --type slsaprovenance --predicate evidence/provenance.json "${subject}"
          "${RUNNER_TEMP}/bin-cosign" attest --yes \
            --type openvex --predicate evidence/openvex.json "${subject}"
          "${RUNNER_TEMP}/bin-cosign" attest --yes \
            --type https://codestra.example/attestation/security-decision/v1 \
            --predicate evidence/security-decision.json "${subject}"
          "${RUNNER_TEMP}/bin-cosign" attest --yes \
            --type https://codestra.example/attestation/evidence-manifest/v1 \
            --predicate evidence/evidence-manifest.json "${subject}"

      - name: Seal signing evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'image=%s@%s\n' "${IMAGE_REPOSITORY}" "${IMAGE_DIGEST}"
            printf 'source_commit=%s\n' "${SOURCE_COMMIT}"
            printf 'release_tag=%s\n' "${RELEASE_TAG}"
            printf 'signing_run=%s\n' "${GITHUB_RUN_ID}"
          } > signing-summary.txt
          sha256sum cosign-version.txt registry-digest.txt signing-summary.txt \
            > signing-SHA256SUMS

      - name: Upload run-scoped signing evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: middleware-signing-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          overwrite: false
          retention-days: 90
          path: |
            cosign-version.txt
            registry-digest.txt
            signing-summary.txt
            signing-SHA256SUMS
