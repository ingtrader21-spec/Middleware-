name: Integrated monitoring API

on:
  pull_request:
    paths:
      - 'app/**'
      - 'migrations/**'
      - 'tests/test_integrated_monitoring.py'
      - 'contracts/observability/integrated-monitoring*'
      - 'scripts/generate_integrated_monitoring_openapi.py'
      - 'requirements*'
      - '.github/workflows/integrated-monitoring.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: monitoring_test_ci
          POSTGRES_USER: monitoring_ci
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U monitoring_ci -d monitoring_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-test.txt
      - name: Check code and contract
        run: |
          ruff check app/monitoring migrations/versions/0059_integrated_monitoring.py tests/test_integrated_monitoring.py scripts/generate_integrated_monitoring_openapi.py
          python scripts/generate_integrated_monitoring_openapi.py --check
      - name: Verify 36 operations, migration and PostgreSQL concurrency
        env:
          MONITORING_TEST_DATABASE_URL: postgresql+asyncpg://monitoring_ci:isolated-ci-only@localhost:5432/monitoring_test_ci
        run: pytest -q tests/test_integrated_monitoring.py
