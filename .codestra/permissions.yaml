apiVersion: platform.codestra.co/v1
kind: Permissions
scopes:
  read: [platform.services.read, platform.provisioning.read]
  write: [platform.services.write, platform.provisioning.request]
  review: [platform.provisioning.validate, platform.provisioning.approve]
  operate: [platform.provisioning.apply, platform.provisioning.rollback]
production:
  approvalRequired: true
  selfApprovalAllowed: false
